<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สรุปคอมเมนต์แจ้งปัญหา</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-box">
    <h1>ระบบสรุปคอมเมนต์แจ้งปัญหา</h1>
    <p class="muted">ศูนย์ปฏิบัติการน้ำท่วม · สำนักงานเขตทวีวัฒนา</p>
    <label>รหัสผ่าน<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <button class="btn primary" type="submit">เข้าสู่ระบบ</button>
    <p id="loginErr" class="error" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <strong>สรุปคอมเมนต์แจ้งปัญหา</strong>
      <span class="muted">สำนักงานเขตทวีวัฒนา</span>
    </div>
    <nav id="nav">
      <a href="#dashboard">Dashboard</a>
      <a href="#list">รายการปัญหา</a>
      <a href="#review" class="admin-only">ตรวจทาน <span id="reviewBadge" class="badge" hidden></span></a>
      <a href="#posts" class="admin-only">โพสต์ &amp; นำเข้า</a>
      <a href="#settings" class="admin-only">ตั้งค่า</a>
    </nav>
    <div class="who">
      <span id="roleLabel" class="chip"></span>
      <button class="btn ghost small" id="logout">ออกจากระบบ</button>
    </div>
  </header>

  <section class="filters" id="filters">
    <label>โพสต์<select id="fPost"><option value="">ทุกโพสต์</option></select></label>
    <label>ตั้งแต่<input type="date" id="fFrom"></label>
    <label>ถึง<input type="date" id="fTo"></label>
    <div class="quick">
      <button class="btn ghost small" data-range="today">วันนี้</button>
      <button class="btn ghost small" data-range="3">3 วัน</button>
      <button class="btn ghost small" data-range="7">7 วัน</button>
      <button class="btn ghost small" data-range="">ทั้งหมด</button>
    </div>
  </section>

  <main id="view"></main>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
